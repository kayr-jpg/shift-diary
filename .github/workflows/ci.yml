name: CI
on:
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
  e2e:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @shift/e2e exec playwright install --with-deps chromium webkit
      # Playwright's webServer starts the Node server (API + built web) on :8787 with a temp DB.
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
  docker:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 90
      - name: Smoke test
        run: |
          curl --fail --silent --show-error http://localhost:8787/api/health
          trips=$(curl --fail --silent --show-error "http://localhost:8787/api/trips?date=2026-10-01")
          echo "$trips"
          grep -q '"tripCount":2' <<< "$trips"
          page=$(curl --fail --silent --show-error http://localhost:8787/)
          grep -qi '<!doctype html' <<< "$page"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
